; foldit configuration.
;
; Searched for in: $FOLDIT_INI, ~/.config/foldit/foldit.ini, then next to
; the foldit executable.
;
; Each language in [Languages] has a section of the same name.  A fold looks
; like this in a file (two spaces after the start mark):
;
;   <StartComment><StartFoldMark>  title<EndComment>
;   ...
;   <StartComment><EndFoldMark><EndComment>
;
; A language is chosen by looking for its markers near the top of the file,
; then by FileExt (comma separated), then by its comment start.  Putting
; <StartComment>{{{}}}<EndComment> (or {{{Name}}}) on the first line forces it.

[Defaults]
FoldPrefix=...
DateTag=
UseOpenFileRefs=1
DelFoldTails=0
PasteBufferLen=100
DefaultLanguage=Plain Text

[Languages]
C++=
C=
Shell=
Lua=
HTML=
INI=
Batch=

[C++]
StartComment=//
EndComment=
StartFoldMark={{{
EndFoldMark=}}}
Tab=8
FileExt=cpp,cc,cxx,h,hpp,hh,js,mjs,ts,java,cs,go,rs,swift,kt,dart
FileRef=#include

[C]
StartComment=/*
EndComment=*/
StartFoldMark={{{
EndFoldMark=}}}
Tab=8
FileExt=c
FileRef=#include

[Shell]
StartComment=#
EndComment=
StartFoldMark={{{
EndFoldMark=}}}
Tab=8
FileExt=sh,bash,zsh,py,pl,rb,r,mk,cmake,toml,yaml,yml,conf,tcl
FileRef=source

[Lua]
StartComment=--
EndComment=
StartFoldMark={{{
EndFoldMark=}}}
Tab=2
FileExt=lua,sql,hs,ada
FileRef=require

[HTML]
StartComment=<!--
EndComment=-->
StartFoldMark={{{
EndFoldMark=}}}
Tab=2
FileExt=html,htm,xml,svg,md
FileRef='

[INI]
StartComment=;
EndComment=
StartFoldMark={{{
EndFoldMark=}}}
Tab=8
FileExt=ini,asm,s,lisp,el,clj
FileRef=

[Batch]
StartComment=::
EndComment=
StartFoldMark={{{
EndFoldMark=}}}
Tab=8
FileExt=bat,cmd
FileRef="rem file"
